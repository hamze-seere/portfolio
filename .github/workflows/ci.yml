name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if they disagree.
      - run: npm ci

      # Fail on high/critical advisories in production dependencies.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://your-domain.dev
          NEXT_TELEMETRY_DISABLED: 1

  # Optional: scan the deployed site with SecureScan after a push to main.
  # Uncomment and point it at your action once hamze-seere/securescan publishes one.
  # security-scan:
  #   name: SecureScan (deployed URL)
  #   needs: verify
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: hamze-seere/securescan@v1   # TODO: pin to a release commit SHA
  #       with:
  #         url: https://your-domain.dev
  #         fail-below: A
